name: Plugin SDK CI

on:
  pull_request:
    paths:
      - "ss-editor/packages/plugin-sdk/**"
  push:
    branches:
      - main
    paths:
      - "ss-editor/packages/plugin-sdk/**"

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ss-editor/packages/plugin-sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "pnpm"
          cache-dependency-path: ss-editor/packages/plugin-sdk/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  test:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
        shard: [1, 2]
    defaults:
      run:
        working-directory: ss-editor/packages/plugin-sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: ss-editor/packages/plugin-sdk/package.json

      - name: Install dependencies
        run: pnpm install --frozen-l
ockfile

      - name: Run tests (shard ${{ matrix.shard }}/2)
        run: pnpm test -- --shard=${{ matrix.shard }}/2

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ss-editor/packages/plugin-sdk
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
          cache-dependency-path: ss-editor/packages/plugin-sdk/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ss-editor/packages/plugin-sdk/coverage/