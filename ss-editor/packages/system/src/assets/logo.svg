<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="50%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="50%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" rx="32" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="66" x2="200" y2="66"/>
    <line x1="0" y1="100" x2="200" y2="100"/>
    <line x1="0" y1="133" x2="200" y2="133"/>
    <line x1="66" y1="0" x2="66" y2="200"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="133" y1="0" x2="133" y2="200"/>
  </g>

  <!-- Radar rings -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="#2196F3" stroke-width="0.5" opacity="0.15"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#2196F3" stroke-width="0.5" opacity="0.1"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="#4CAF50" stroke-width="0.5" opacity="0.08"/>

  <!-- Cardinal marks -->
  <g opacity="0.12" stroke="#42A5F5" stroke-width="1.5" stroke-linecap="round">
    <line x1="100" y1="22" x2="100" y2="30"/>
    <line x1="100" y1="170" x2="100" y2="178"/>
    <line x1="22" y1="100" x2="30" y2="100"/>
    <line x1="170" y1="100" x2="178" y2="100"/>
  </g>

  <!-- First S (blue) - upper, represents ss-data -->
  <path d="M 125 38
           C 145 42, 65 55, 60 65
           C 55 75, 95 80, 98 90
           C 102 100, 75 105, 60 98"
        fill="none" stroke="url(#blueGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Second S (green) - lower, represents ss-scada -->
  <path d="M 125 72
           C 145 76, 65 89, 60 99
           C 55 109, 95 114, 98 124
           C 102 134, 75 139, 60 132"
        fill="none" stroke="url(#greenGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center connector node -->
  <circle cx="82" cy="95" r="5" fill="#FF9800" filter="url(#glow)"/>
  <circle cx="82" cy="95" r="2.5" fill="#FFE0B2"/>

  <!-- Data flow dots -->
  <circle cx="125" cy="38" r="3.5" fill="#90CAF9"/>
  <circle cx="60" cy="98" r="3.5" fill="#90CAF9"/>
  <circle cx="60" cy="132" r="3.5" fill="#A5D6A7"/>

  <!-- Small accent dots -->
  <circle cx="40" cy="45" r="2" fill="#FFC107" opacity="0.6"/>
  <circle cx="155" cy="130" r="2" fill="#FFC107" opacity="0.6"/>
  <circle cx="45" cy="155" r="2" fill="#FFC107" opacity="0.6"/>
</svg>
