<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="50%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="50%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon area -->
  <g transform="translate(75,80)">
    <rect x="-65" y="-65" width="130" height="130" rx="22" fill="url(#bgGrad)"/>

    <g opacity="0.05" stroke="#FFFFFF" stroke-width="0.4">
      <line x1="-65" y1="-22" x2="65" y2="-22"/>
      <line x1="-65" y1="0" x2="65" y2="0"/>
      <line x1="-65" y1="22" x2="65" y2="22"/>
      <line x1="-22" y1="-65" x2="-22" y2="65"/>
      <line x1="0" y1="-65" x2="0" y2="65"/>
      <line x1="22" y1="-65" x2="22" y2="65"/>
    </g>

    <circle cx="0" cy="0" r="55" fill="none" stroke="#2196F3" stroke-width="0.4" opacity="0.15"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#2196F3" stroke-width="0.4" opacity="0.1"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#4CAF50" stroke-width="0.4" opacity="0.08"/>

    <g opacity="0.12" stroke="#42A5F5" stroke-width="1.2" stroke-linecap="round">
      <line x1="0" y1="-55" x2="0" y2="-48"/>
      <line x1="0" y1="48" x2="0" y2="55"/>
      <line x1="-55" y1="0" x2="-48" y2="0"/>
      <line x1="48" y1="0" x2="55" y2="0"/>
    </g>

    <!-- First S (blue) - ss-data -->
    <path d="M 28 -25
             C 42 -22, -12 -12, -16 -3
             C -20 6, 2 9, 4 16
             C 6 23, -10 27, -16 22"
          fill="none" stroke="url(#blueGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Second S (green) - ss-scada -->
    <path d="M 28 1
             C 42 4, -12 14, -16 23
             C -20 32, 2 35, 4 42
             C 6 49, -10 53, -16 48"
          fill="none" stroke="url(#greenGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="-2" cy="13" r="4" fill="#FF9800" filter="url(#glow)"/>
    <circle cx="-2" cy="13" r="2" fill="#FFE0B2"/>

    <circle cx="28" cy="-25" r="3" fill="#90CAF9"/>
    <circle cx="-16" cy="22" r="3" fill="#90CAF9"/>
    <circle cx="-16" cy="48" r="3" fill="#A5D6A7"/>

    <circle cx="-40" cy="-30" r="1.5" fill="#FFC107" opacity="0.5"/>
    <circle cx="45" cy="35" r="1.5" fill="#FFC107" opacity="0.5"/>
    <circle cx="-35" cy="45" r="1.5" fill="#FFC107" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="165" y="60" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif" font-size="32" font-weight="700" fill="#1a2332" letter-spacing="2">SMART DATA</text>

  <line x1="165" y1="78" x2="510" y2="78" stroke="#2196F3" stroke-width="1" opacity="0.25"/>

  <!-- English subtitle -->
  <text x="165" y="102" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#616161" letter-spacing="1">Data Platform</text>

  <!-- Chinese subtitle -->
  <text x="165" y="122" font-family="'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="11" fill="#9E9E9E" letter-spacing="1.5">数据中台</text>
</svg>
